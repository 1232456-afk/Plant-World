<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant World 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #1a3a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Animated background leaves */
  .bg-leaves {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  .leaf-stripe {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #1a3a2a, #2d6a4f, #40916c, #74c69d, #b7e4c7);
    background-size: 400% 400%;
    animation: gradShift 8s ease infinite;
  }
  @keyframes gradShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Floating particles */
  .particle {
    position: absolute;
    font-size: 24px;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Welcome box */
  .welcome-box {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 50px 60px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    animation: fadeIn 0.8s ease;
    max-width: 480px;
    width: 90%;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .brand-icon { font-size: 56px; margin-bottom: 16px; display: block; animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .welcome-box h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: #ffffff;
    margin-bottom: 6px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .welcome-box .brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #b7e4c7;
    margin-bottom: 12px;
    font-weight: 700;
  }
  .welcome-box p {
    color: rgba(255,255,255,0.75);
    font-size: 14px;
    font-weight: 300;
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #74c69d, #c9a84c);
    border-radius: 2px;
    width: 0%;
    animation: fillBar 5s linear forwards;
  }
  @keyframes fillBar { to { width: 100%; } }
  .skip-link {
    display: block;
    margin-top: 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.3s;
  }
  .skip-link:hover { color: rgba(255,255,255,0.85); }
</style>
</head>
<body>

<div class="bg-leaves"><div class="leaf-stripe"></div></div>

<!-- Floating emojis -->
<div class="bg-leaves" id="particles"></div>

<div class="welcome-box">
  <span class="brand-icon">🌿</span>
  <h1 id="greetMsg">Welcome</h1>
  <div class="brand">Plant World</div>
  <p>Explore the beauty of plants from around the world</p>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <a class="skip-link" href="home.html">Enter now →</a>
</div>

<script>
  // Greeting
  const h = new Date().getHours();
  const msgs = { morning:'Good Morning ☀️', afternoon:'Good Afternoon 🌿', evening:'Good Evening 🌸', night:'Good Night 🌙' };
  document.getElementById('greetMsg').textContent =
    h < 12 ? msgs.morning : h < 17 ? msgs.afternoon : h < 20 ? msgs.evening : msgs.night;

  // Particles
  const emojis = ['🌱','🌿','🍃','🌺','🌸','🪴','🌻','🌼','🍀','🎋'];
  const container = document.getElementById('particles');
  for(let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (6 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*6) + 's';
    p.style.fontSize = (16 + Math.random()*20) + 'px';
    container.appendChild(p);
  }

  // Redirect after 5s
  setTimeout(() => { window.location.href = 'home.html'; }, 5000);
</script>
</body>
</html>
