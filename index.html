<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant World 🌿</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #1a3a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #1a3a2a, #2d6a4f, #40916c, #74c69d);
      background-size: 300% 300%;
      animation: bgMove 10s ease infinite;
      z-index: 0;
    }
    @keyframes bgMove {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    /* Floating particles */
    .particles { position:fixed; inset:0; z-index:1; pointer-events:none; }
    .particle {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity:0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.30; }
      100% { transform: translateY(-10vh)  rotate(360deg); opacity:0; }
    }

    /* Welcome card */
    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 400px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 24px;
      padding: 38px 32px 30px;
      text-align: center;
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(28px) scale(0.95); }
      to   { opacity:1; transform: translateY(0)    scale(1); }
    }

    .icon {
      display: block;
      font-size: 50px;
      margin-bottom: 12px;
      animation: pulse 2.5s ease infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    .greeting {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      color: #74c69d;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .tagline {
      color: rgba(255,255,255,0.60);
      font-size: clamp(12px, 3.5vw, 13px);
      font-weight: 300;
      margin-bottom: 24px;
      line-height: 1.55;
    }

    /* Progress bar */
    .bar-wrap {
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #74c69d, #c9a84c);
      border-radius: 4px;
      animation: fill 5s linear forwards;
    }
    @keyframes fill { to { width: 100%; } }

    .skip {
      display: inline-block;
      font-size: 12px;
      color: rgba(255,255,255,0.42);
      text-decoration: none;
      transition: color 0.25s;
      padding: 4px;
    }
    .skip:hover, .skip:active { color: rgba(255,255,255,0.85); }

    /* Mobile */
    @media (max-width: 360px) {
      .card { padding: 28px 20px 24px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="card">
    <span class="icon">🌿</span>
    <h1 class="greeting" id="greetMsg">Welcome</h1>
    <div class="brand">Plant World</div>
    <p class="tagline">Explore the beauty of plants from around the world</p>
    <div class="bar-wrap"><div class="bar-fill"></div></div>
    <a class="skip" href="home.html">Enter now →</a>
  </div>

  <script>
    // Greeting
    var h = new Date().getHours();
    document.getElementById('greetMsg').textContent =
      h < 12 ? 'Good Morning ☀️' :
      h < 17 ? 'Good Afternoon 🌿' :
      h < 20 ? 'Good Evening 🌸' : 'Good Night 🌙';

    // Floating particles
    var emojis = ['🌱','🌿','🍃','🌺','🌸','🪴','🌻','🌼','🍀','🎋'];
    var wrap   = document.getElementById('particles');
    for (var i = 0; i < 16; i++) {
      var el = document.createElement('span');
      el.className = 'particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left              = Math.random() * 100 + 'vw';
      el.style.fontSize          = (13 + Math.random() * 16) + 'px';
      el.style.animationDuration = (7  + Math.random() * 8)  + 's';
      el.style.animationDelay    = (Math.random() * 6)        + 's';
      wrap.appendChild(el);
    }

    // Redirect after 5s
    setTimeout(function () { window.location.href = 'home.html'; }, 5000);
  </script>
</body>
</html>
